[project]
name = "israeli-tax-refund-calculator"
version = "0.1.0"
description = "A FastAPI server for estimating Israeli income tax refunds."
authors = [{ name = "Ori Roza", email = "ori75660@gmail.com" }]

[tool.poetry]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.9"
fastapi = "^0.111.0"
pytesseract = "^0.3.10"
pydantic = "^2.8.0"
PyMuPDF= "^1.24.9"
opencv-python-headless = "^4.9.0.80"
numpy = "^1.26.4"
pillow = "^10.3.0"
beautifulsoup4 = "^4.12.3"
requests = "^2.34.0"
loguru = "^0.7.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
